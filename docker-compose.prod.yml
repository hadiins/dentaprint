# ───────── اجرای کامل روی سرور مجازی (VPS) ─────────
#   cp .env.example .env   ← مقادیر را پر کنید (DOMAIN, AUTH_SECRET, ...)
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dentaprint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD را در .env تنظیم کنید}
      POSTGRES_DB: ${POSTGRES_DB:-dentaprint}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dentaprint}"]
      interval: 10s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dentaprint}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dentaprint}?schema=public
      NEXT_PUBLIC_SITE_URL: https://${DOMAIN:?DOMAIN را در .env تنظیم کنید}
    volumes: [appdata:/data]
    depends_on:
      db: { condition: service_healthy }

  # HTTPS خودکار (Let's Encrypt) و پروکسی
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: { DOMAIN: "${DOMAIN}" }
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [app]

volumes:
  pgdata:
  appdata:
  caddydata:
